name: Executar Testes do Postman

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar o Newman
        run: npm install -g newman

      - name: Rodar Coleção do Postman
        run: newman run Biblioteca.postman_collection.json
